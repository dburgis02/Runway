    --surface:#28242e;
    --surface-2:#2f2b37;
    --line:#3a3542;
    --text:#ede9e3;
    --muted:#938ea1;
    --now:#7bc47f;
    --now-glow:rgba(123,196,127,0.35);
    --danger:#e06a6a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  input,button,select{font-size:16px;} /* prevents iOS auto-zoom on focus */

  header{
    padding:16px 18px 12px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(180deg,var(--bg-2),var(--bg));
    position:sticky; top:0; z-index:20;
  }
  header .brand{display:flex; flex-direction:column; gap:2px;}
  header .brand .title{font-size:18px; font-weight:700; letter-spacing:0.2px;}
  header .brand .sub{font-size:10.5px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase;}
  .clock{font-size:12.5px; color:var(--now); display:flex; align-items:center; gap:6px;}
  .dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--now); box-shadow:0 0 0 0 var(--now-glow); animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 var(--now-glow);}
    70%{box-shadow:0 0 0 8px rgba(123,196,127,0);}
    100%{box-shadow:0 0 0 0 rgba(123,196,127,0);}
  }

  .toast{
    position:fixed; top:10px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:#3a2626; border:1px solid #6a3a3a; color:#f0c9c9; font-size:12.5px;
    padding:9px 14px; border-radius:9px; z-index:100; transition:transform 0.25s ease; max-width:88%; text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.good{background:#26362a; border-color:#3a6a45; color:#c9f0d3;}

  /* Tabs (mobile) */
  .tabs{display:flex; gap:6px; padding:10px 14px; background:var(--bg); position:sticky; top:58px; z-index:19; border-bottom:1px solid var(--line);}
  .tab-btn{
    flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-family:'Space Grotesk'; font-size:12.5px; font-weight:600;
    letter-spacing:0.3px; text-transform:uppercase; cursor:pointer;
  }
  .tab-btn.active{background:var(--surface-2); color:var(--text); border-color:#4a4456;}

  main{flex:1; display:grid; grid-template-columns:1fr; gap:0; padding:14px; width:100%; max-width:1200px; margin:0 auto;}

  .col{display:none; flex-direction:column; gap:12px; min-height:0;}
  .col.active{display:flex;}

  .col-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px; gap:8px;}
  .col-head h2{font-size:14px; margin:0; letter-spacing:0.4px; text-transform:uppercase; color:var(--muted);}
  .col-head .count{font-size:11px; color:var(--muted);}
  .col-controls{display:flex; gap:6px; align-items:center;}
  .mini-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:8px;
    padding:6px 9px; font-size:11px; font-family:'Space Grotesk'; font-weight:600; cursor:pointer; letter-spacing:0.2px;
  }
  .mini-btn.on{background:var(--surface-2); color:var(--text); border-color:#4a4456;}
  .mini-btn.warn{color:var(--danger); border-color:#5a3838;}

  /* Category / task column */
  .category-block{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .category-bar{display:flex; align-items:center; gap:9px; padding:11px 12px; border-bottom:1px solid var(--line);}
  .swatch{width:14px; height:14px; border-radius:50%; flex-shrink:0; cursor:pointer; border:2px solid transparent;}
  .category-bar .cname{font-weight:600; font-size:14px; flex:1; background:none; border:none; color:var(--text); font-family:'Inter'; padding:2px 0;}
  .category-bar .cname:focus{outline:none; border-bottom:1px solid var(--muted);}
  .category-bar .del-cat{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px;}
  .swatch-row{display:none; gap:6px; padding:0 12px 10px; flex-wrap:wrap;}
  .swatch-row.open{display:flex;}
  .swatch-row span{width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch-row span.sel{border-color:#fff;}
  .task-list{padding:8px; display:flex; flex-direction:column; gap:6px;}
  .task-add{display:flex; gap:6px; padding:8px 10px 10px; flex-wrap:wrap;}
  .task-add input[type=text]{flex:1; min-width:120px; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; color:var(--text);}
  .task-add select{background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:9px 6px; color:var(--text);}
  .task-add button{background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:0 12px; cursor:pointer;}

  .task-chip{
    display:flex; align-items:center; gap:8px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:9px; padding:8px 9px; cursor:pointer; font-size:13.5px; line-height:1.3;
  }
  .task-chip.selected{border-color:#8b7fe0; box-shadow:0 0 0 2px rgba(139,127,224,0.25);}
  .task-chip.now{border-color:var(--now); box-shadow:0 0 0 2px var(--now-glow); background:rgba(123,196,127,0.08);}
  .task-chip .txt{flex:1;}
  .task-chip .time-badge{font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono'; flex-shrink:0; background:var(--surface-2); padding:2px 6px; border-radius:6px;}
  .task-chip .len-badge{font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono'; flex-shrink:0;}
  .task-chip .check{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--muted); flex-shrink:0;}
  .task-chip .check.on{background:var(--now); border-color:var(--now); position:relative;}
  .task-chip .check.on::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#16311a;}
  .task-chip.done .txt{text-decoration:line-through; color:var(--muted);}
  .task-chip.done{opacity:0.6;}

  .add-cat-row{display:flex; gap:8px; align-items:center;}
  .add-cat-row input[type=text]{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px 11px; color:var(--text);}
  .color-picker{display:flex; gap:5px;}
  .color-picker span{width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .color-picker span.sel{border-color:#fff;}
  .add-cat-row button{background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:10px 13px; cursor:pointer;}

  /* Schedule column */
  .schedule-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .slot{display:flex; border-bottom:1px solid var(--line);}
  .slot:last-child{border-bottom:none;}
  .slot-time{width:64px; flex-shrink:0; font-size:11px; color:var(--muted); padding:11px 8px; border-right:1px solid var(--line); font-family:'IBM Plex Mono';}
  .slot-body{flex:1; padding:6px 8px; display:flex; align-items:center; gap:6px; cursor:pointer;}
  .slot.now{background:rgba(123,196,127,0.09);}
  .slot.now .slot-time{color:var(--now); font-weight:600;}
  .slot.now::before{content:''; width:3px; align-self:stretch; background:var(--now);}
  .slot-empty-hint{font-size:12px; color:#5c5868; font-style:italic;}
  .slot .task-chip{width:100%; padding:6px 8px; align-self:stretch; height:100%;}

  /* Action bar for selected task */
  .action-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--surface-2); border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:none; z-index:50;
    box-shadow:0 -8px 24px rgba(0,0,0,0.35); max-height:70vh; overflow-y:auto;
  }
  .action-bar.show{display:block;}
  .action-bar .sel-label{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .action-bar .sel-label b{color:var(--text); font-weight:600;}
  .action-bar .sel-label button{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer;}
  .action-grid{display:flex; flex-wrap:wrap; gap:7px;}
  .action-grid button{
    flex:1; min-width:90px; background:var(--bg-2); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:9px 8px; font-size:12.5px; font-family:'Space Grotesk'; font-weight:600; cursor:pointer;
  }
  .action-grid button.danger{color:var(--danger); border-color:#5a3838;}
  .picker-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin:10px 0 6px;}
  .slot-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:180px; overflow-y:auto;}
  .slot-picker button{background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:7px 4px; font-size:11.5px; font-family:'IBM Plex Mono'; cursor:pointer;}
  .slot-picker button.taken{opacity:0.3; text-decoration:line-through; pointer-events:none;}
  .duration-picker{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .duration-picker button{background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 6px; font-size:12.5px; font-family:'Space Grotesk'; font-weight:600; cursor:pointer;}
  .duration-picker button.sel{border-color:var(--now); color:var(--now);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  @media (min-width:900px){
    .tabs{display:none;}
    main{grid-template-columns:1.2fr 1fr; gap:16px; align-items:start;}
    .col{display:flex !important;}
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="brand">
    <div class="title">Runway</div>
    <div class="sub">today's board</div>
  </div>
  <div class="clock mono"><span class="dot-pulse"></span><span id="clockText">--:--</span></div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="tasks">Tasks</button>
  <button class="tab-btn" data-tab="schedule">Schedule</button>
</div>

<main>
  <section class="col active" id="col-tasks">
    <div class="col-head">
      <h2>Categories</h2>
      <div class="col-controls">
        <button class="mini-btn" id="toggleCompletedBtn">Show done</button>
        <button class="mini-btn warn" id="clearCompletedBtn">Clear done</button>
      </div>
    </div>
    <div id="categoryList"></div>
    <div class="category-block" style="padding:12px;">
      <div class="add-cat-row" style="margin-bottom:8px;">
        <input type="text" id="newCatName" placeholder="New category">
      </div>
      <div class="add-cat-row">
        <div class="color-picker" id="colorPicker"></div>
        <button id="addCatBtn">Add category</button>
      </div>
    </div>
  </section>

  <section class="col" id="col-schedule">
    <div class="col-head"><h2>Schedule</h2><span class="count mono" id="nowLabel"></span></div>
    <div class="schedule-wrap" id="scheduleWrap"></div>
  </section>
</main>

<div class="action-bar" id="actionBar">
  <div class="sel-label"><span>"<b id="selText"></b>"</span><button id="closeActionBar">✕</button></div>
  <div class="action-grid" id="actionGrid"></div>
  <div id="lengthPickerWrap" style="display:none;">
    <div class="picker-label">Length</div>
    <div class="duration-picker" id="lengthPicker"></div>
  </div>
  <div id="schedulePickerWrap" style="display:none;">
    <div class="picker-label">Start time <span id="lenHint" class="mono" style="color:var(--muted); text-transform:none;"></span></div>
    <div class="slot-picker" id="slotPicker"></div>
  </div>
</div>

<script>
const COLORS = ['#e8735a','#e0a458','#4fb0a5','#5b8def','#9b7ede','#e07ba8','#8fbf6f','#7a8ca3'];
const START_HOUR = 6, END_HOUR = 23.5; // 6:00am to 11:30pm, last slot start
const SLOTS = [];
for(let h=START_HOUR; h<=END_HOUR; h+=0.5){
  const hh = Math.floor(h);
  const mm = h % 1 === 0 ? '00' : '30';
  const label = ((hh % 12) || 12) + ':' + mm + (hh < 12 ? 'am' : 'pm');
  SLOTS.push(label);
}
const DURATIONS = [
  {label:'30m', span:1}, {label:'1h', span:2}, {label:'1.5h', span:3},
  {label:'2h', span:4}, {label:'3h', span:6}, {label:'4h', span:8},
];

const DEFAULT_CATEGORIES = [
  {id:'housework', name:'Housework', color:'#4fb0a5'},
  {id:'workingout', name:'Working Out', color:'#e0a458'},
  {id:'errands', name:'Errands', color:'#e8735a'},
];

let state = { categories: [], tasks: [] };
let selectedColor = COLORS[0];
let selectedTaskId = null;
let showCompleted = false;
let clearArmed = false;
let currentTab = 'tasks';
let openSwatchRowFor = null;

const uid = () => Math.random().toString(36).slice(2,10);
const durationLabel = (span) => (DURATIONS.find(d => d.span === span) || {label: (span*0.5)+'h'}).label;

function showToast(msg, good){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('good', !!good);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

async function loadState(){
  let loaded = null;
  try{
    const raw = localStorage.getItem('board-state');
    if(raw) loaded = JSON.parse(raw);
  }catch(e){
    loaded = null; // no saved data yet, or it was corrupted — start fresh
  }
  if(loaded && loaded.categories){
    state = loaded;
    state.tasks.forEach(t => { if(!t.span) t.span = 1; });
  } else {
    state = { categories: DEFAULT_CATEGORIES.map(c => ({...c})), tasks: [] };
    saveState();
  }
  render();
}

function saveState(){
  try{
    localStorage.setItem('board-state', JSON.stringify(state));
  }catch(e){
    showToast("Couldn't save — your phone's storage might be full.");
  }
}

function currentSlotIndex(){
  const now = new Date();
  const h = now.getHours() + now.getMinutes()/60;
  if(h < START_HOUR || h > END_HOUR + 0.5) return -1;
  return Math.floor((h - START_HOUR) / 0.5);
}

function endLabel(startIdx, span){
  const endIdx = startIdx + span;
  const h = START_HOUR + endIdx * 0.5;
  const hh = Math.floor(h) % 24;
  const mm = h % 1 === 0 ? '00' : '30';
  return ((hh % 12) || 12) + ':' + mm + (hh < 12 ? 'am' : 'pm');
}

function updateClock(){
  const now = new Date();
  let h = now.getHours(); const m = now.getMinutes();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  document.getElementById('clockText').textContent = h + ':' + String(m).padStart(2,'0') + ampm;
  const idx = currentSlotIndex();
  document.getElementById('nowLabel').textContent = idx >= 0 ? 'now: ' + SLOTS[idx] : '';
  render();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.col').forEach(c => c.classList.remove('active'));
  document.getElementById('col-'+tab).classList.add('active');
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

function buildColorPicker(){
  const wrap = document.getElementById('colorPicker');
  wrap.innerHTML = '';
  COLORS.forEach(c => {
    const s = document.createElement('span');
    s.style.background = c;
    if(c === selectedColor) s.classList.add('sel');
    s.addEventListener('click', () => { selectedColor = c; buildColorPicker(); });
    wrap.appendChild(s);
  });
}
buildColorPicker();

document.getElementById('addCatBtn').addEventListener('click', () => {
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name) return;
  state.categories.push({id: uid(), name, color: selectedColor});
  input.value = '';
  saveState(); render();
});

document.getElementById('toggleCompletedBtn').addEventListener('click', () => {
  showCompleted = !showCompleted;
  render();
});

document.getElementById('clearCompletedBtn').addEventListener('click', (e) => {
  if(!clearArmed){
    clearArmed = true;
    e.target.textContent = 'Tap to confirm';
    setTimeout(() => { clearArmed = false; e.target.textContent = 'Clear done'; }, 3000);
    return;
  }
  const n = state.tasks.filter(t => t.done).length;
  state.tasks = state.tasks.filter(t => !t.done);
  clearArmed = false;
  e.target.textContent = 'Clear done';
  saveState(); render();
  showToast(n + (n===1?' task':' tasks') + ' cleared', true);
});

function selectTask(id){
  selectedTaskId = id;
  render();
  openActionBar();
}

function openActionBar(){
  const task = state.tasks.find(t => t.id === selectedTaskId);
  if(!task) return closeActionBar();
  document.getElementById('selText').textContent = task.text;
  const grid = document.getElementById('actionGrid');
  grid.innerHTML = '';
  document.getElementById('lengthPickerWrap').style.display = 'none';
  document.getElementById('schedulePickerWrap').style.display = 'none';

  const opts = [
    [task.slot !== null ? '🕐 Reschedule…' : '🕐 Schedule…', () => showSlotPicker()],
    ['⏱ Length: ' + durationLabel(task.span), () => showLengthPicker()],
    [task.slot !== null ? '↺ Unschedule' : null, () => unschedule(task.id)],
    [task.done ? '↺ Mark undone' : '✓ Mark done', () => toggleDone(task.id)],
    ['🗑 Delete', () => deleteTask(task.id), true],
  ].filter(o => o[0]);
  opts.forEach(([label, fn, danger]) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    if(danger) btn.classList.add('danger');
    btn.addEventListener('click', fn);
    grid.appendChild(btn);
  });
  document.getElementById('actionBar').classList.add('show');
}

function occupiedRanges(excludeId){
  return state.tasks
    .filter(t => t.slot != null && t.id !== excludeId)
    .map(t => [t.slot, t.slot + (t.span||1)]);
}

function showLengthPicker(){
  document.getElementById('schedulePickerWrap').style.display = 'none';
  const wrap = document.getElementById('lengthPickerWrap');
  wrap.style.display = 'block';
  const task = state.tasks.find(t => t.id === selectedTaskId);
  const lp = document.getElementById('lengthPicker');
  lp.innerHTML = '';
  DURATIONS.forEach(d => {
    const btn = document.createElement('button');
    btn.textContent = d.label;
    if(d.span === task.span) btn.classList.add('sel');
    btn.addEventListener('click', () => setLength(task.id, d.span));
    lp.appendChild(btn);
  });
}

function setLength(id, span){
  const task = state.tasks.find(t => t.id === id);
  if(!task) return;
  if(task.slot != null){
    const ranges = occupiedRanges(id);
    const conflict = ranges.some(([s,e]) => task.slot < e && (task.slot + span) > s);
    const fitsDay = (task.slot + span) <= SLOTS.length;
    if(conflict || !fitsDay){
      showToast("That length doesn't fit where it's scheduled — reschedule it first.");
      return;
    }
  }
  task.span = span;
  saveState();
  openActionBar();
}

function showSlotPicker(){
  document.getElementById('lengthPickerWrap').style.display = 'none';
  const wrap = document.getElementById('schedulePickerWrap');
  wrap.style.display = 'block';
  const task = state.tasks.find(t => t.id === selectedTaskId);
  document.getElementById('lenHint').textContent = '(' + durationLabel(task.span) + ' block)';
  const picker = document.getElementById('slotPicker');
  picker.innerHTML = '';
  const ranges = occupiedRanges(selectedTaskId);
  SLOTS.forEach((label, idx) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    const fitsDay = idx + task.span <= SLOTS.length;
    const overlaps = ranges.some(([s,e]) => idx < e && (idx + task.span) > s);
    if(!fitsDay || overlaps) btn.classList.add('taken');
    else btn.addEventListener('click', () => scheduleTask(selectedTaskId, idx));
    picker.appendChild(btn);
  });
}

function closeActionBar(){
  selectedTaskId = null;
  openSwatchRowFor = null;
  document.getElementById('actionBar').classList.remove('show');
  render();
}
document.getElementById('closeActionBar').addEventListener('click', closeActionBar);

function scheduleTask(id, slot){
  const task = state.tasks.find(t => t.id === id);
  if(!task) return;
  task.slot = slot;
  saveState();
  closeActionBar();
  switchTab('schedule');
}

function unschedule(id){
  const task = state.tasks.find(t => t.id === id);
  if(!task) return;
  task.slot = null;
  saveState();
  closeActionBar();
}

function toggleDone(id){
  const task = state.tasks.find(t => t.id === id);
  if(!task) return;
  task.done = !task.done;
  saveState();
  render();
  if(document.getElementById('actionBar').classList.contains('show')) closeActionBar();
}

function deleteTask(id){
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  closeActionBar();
}

function renameCategory(id, name){
  const cat = state.categories.find(c => c.id === id);
  if(!cat || !name.trim()) return;
  cat.name = name.trim();
  saveState();
}

function recolorCategory(id, color){
  const cat = state.categories.find(c => c.id === id);
  if(!cat) return;
  cat.color = color;
  saveState();
  render();
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function taskChip(task, cat, opts){
  opts = opts || {};
  const div = document.createElement('div');
  div.className = 'task-chip';
  const isSelected = task.id === selectedTaskId;
  if(isSelected) div.classList.add('selected');
  if(task.done) div.classList.add('done');
  const idx = currentSlotIndex();
  const isNow = task.slot != null && idx >= task.slot && idx < task.slot + (task.span||1) && !task.done;
  if(isNow) div.classList.add('now');

  const base = cat ? cat.color : '#7a7a7a';
  div.style.background = hexToRgba(base, task.done ? 0.09 : 0.24);
  div.style.borderColor = isNow ? 'var(--now)' : isSelected ? '#8b7fe0' : hexToRgba(base, 0.65);

  const check = document.createElement('div');
  check.className = 'check' + (task.done ? ' on' : '');
  check.addEventListener('click', (e) => { e.stopPropagation(); toggleDone(task.id); });
  div.appendChild(check);

  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = task.text;
  div.appendChild(txt);

  if(opts.showLen){
    const len = document.createElement('div');
    len.className = 'len-badge';
    len.textContent = durationLabel(task.span);
    div.appendChild(len);
  }

  if(opts.showTime && task.slot != null){
    const badge = document.createElement('div');
    badge.className = 'time-badge';
    badge.textContent = SLOTS[task.slot] + (task.span > 1 ? '–' + endLabel(task.slot, task.span) : '');
    div.appendChild(badge);
  }

  div.addEventListener('click', () => selectTask(task.id));
  return div;
}

function render(){
  document.getElementById('toggleCompletedBtn').classList.toggle('on', showCompleted);
  document.getElementById('toggleCompletedBtn').textContent = showCompleted ? 'Hide done' : 'Show done';

  // Category / task column
  const catList = document.getElementById('categoryList');
  catList.innerHTML = '';
  state.categories.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'category-block';

    const bar = document.createElement('div');
    bar.className = 'category-bar';

    const sw = document.createElement('div');
    sw.className='swatch'; sw.style.background = cat.color;
    sw.addEventListener('click', () => {
      openSwatchRowFor = openSwatchRowFor === cat.id ? null : cat.id;
      render();
    });
    const name = document.createElement('input');
    name.className='cname'; name.value = cat.name;
    name.addEventListener('blur', () => renameCategory(cat.id, name.value));
    name.addEventListener('keydown', e => { if(e.key === 'Enter') name.blur(); });
    const del = document.createElement('button'); del.className='del-cat'; del.textContent='✕';
    del.addEventListener('click', () => {
      state.categories = state.categories.filter(c => c.id !== cat.id);
      state.tasks = state.tasks.filter(t => t.categoryId !== cat.id);
      saveState(); render();
    });
    bar.appendChild(sw); bar.appendChild(name); bar.appendChild(del);
    block.appendChild(bar);

    const swatchRow = document.createElement('div');
    swatchRow.className = 'swatch-row' + (openSwatchRowFor === cat.id ? ' open' : '');
    COLORS.forEach(c => {
      const s = document.createElement('span');
      s.style.background = c;
      if(c === cat.color) s.classList.add('sel');
      s.addEventListener('click', () => recolorCategory(cat.id, c));
      swatchRow.appendChild(s);
    });
    block.appendChild(swatchRow);

    const list = document.createElement('div');
    list.className = 'task-list';
    const tasks = state.tasks.filter(t => t.categoryId === cat.id && (showCompleted || !t.done));
    tasks.forEach(t => list.appendChild(taskChip(t, cat, {showTime:true, showLen:true})));
    block.appendChild(list);

    const addRow = document.createElement('div');
    addRow.className = 'task-add';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Add a task…';
    input.addEventListener('focus', () => {
      setTimeout(() => input.scrollIntoView({block:'center', behavior:'smooth'}), 250);
    });
    const lenSelect = document.createElement('select');
    DURATIONS.forEach(d => {
      const o = document.createElement('option');
      o.value = d.span; o.textContent = d.label;
      lenSelect.appendChild(o);
    });
    const btn = document.createElement('button');
    btn.textContent = 'Add';
    const addFn = () => {
      const val = input.value.trim();
      if(!val) return;
      state.tasks.push({id: uid(), categoryId: cat.id, text: val, slot:null, span: parseInt(lenSelect.value), done:false});
      input.value = '';
      saveState(); render();
    };
    btn.addEventListener('click', addFn);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') addFn(); });
    addRow.appendChild(input); addRow.appendChild(lenSelect); addRow.appendChild(btn);
    block.appendChild(addRow);

    catList.appendChild(block);
  });

  // Schedule — start ~2 hours (4 slots) before now, or the whole day if it's still early
  const idx = currentSlotIndex();
  let visibleStart = idx >= 0 ? Math.max(0, idx - 4) : 0;
  // don't cut a task in half — if something scheduled earlier is still running, back up to its start
  state.tasks.forEach(t => {
    if(t.slot != null && t.slot < visibleStart && t.slot + (t.span||1) > visibleStart){
      visibleStart = t.slot;
    }
  });
  const sched = document.getElementById('scheduleWrap');
  sched.innerHTML = '';
  let i = visibleStart;
  while(i < SLOTS.length){
    const task = state.tasks.find(t => t.slot === i);
    const row = document.createElement('div');
    if(task){
      const span = task.span || 1;
      row.className = 'slot' + ((idx >= i && idx < i+span) ? ' now' : '');
      row.style.minHeight = (44*span) + 'px';
      const time = document.createElement('div');
      time.className = 'slot-time';
      time.textContent = SLOTS[i];
      row.appendChild(time);
      const body = document.createElement('div');
      body.className = 'slot-body';
      body.appendChild(taskChip(task, state.categories.find(c=>c.id===task.categoryId)));
      row.appendChild(body);
      sched.appendChild(row);
      i += span;
    } else {
      row.className = 'slot' + (i === idx ? ' now' : '');
      const time = document.createElement('div');
      time.className = 'slot-time';
      time.textContent = SLOTS[i];
      row.appendChild(time);
      const body = document.createElement('div');
      body.className = 'slot-body';
      const hint = document.createElement('div');
      hint.className = 'slot-empty-hint';
      hint.textContent = 'open';
      body.appendChild(hint);
      body.addEventListener('click', () => {
        if(!selectedTaskId) return;
        const sel = state.tasks.find(t => t.id === selectedTaskId);
        if(!sel) return;
        const ranges = occupiedRanges(selectedTaskId);
        const fitsDay = i + sel.span <= SLOTS.length;
        const overlaps = ranges.some(([s,e]) => i < e && (i + sel.span) > s);
        if(fitsDay && !overlaps) scheduleTask(selectedTaskId, i);
        else showToast("Doesn't fit there — pick another start time.");
      });
      row.appendChild(body);
      sched.appendChild(row);
      i += 1;
    }
  }
}

// Swipe between Tasks and Schedule on touch/mobile
let touchStartX = 0, touchStartY = 0, touchActive = false;
const mainEl = document.querySelector('main');
mainEl.addEventListener('touchstart', e => {
  if(window.innerWidth >= 900) return; // desktop shows both columns, no swipe needed
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchActive = true;
}, {passive:true});
mainEl.addEventListener('touchend', e => {
  if(!touchActive) return;
  touchActive = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
    if(dx < 0 && currentTab === 'tasks') switchTab('schedule');
    else if(dx > 0 && currentTab === 'schedule') switchTab('tasks');
  }
}, {passive:true});

loadState();
updateClock();
setInterval(updateClock, 30000);

</script>
</body>
